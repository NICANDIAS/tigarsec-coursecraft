<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TIGARSEC Assess{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function() {
      var t = localStorage.getItem("tigarsec-assess-theme");
      if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="auth-topbar">
    <div class="sidebar-brand">
      <img src="/static/img/logo.png" alt="" class="brand-logo" onerror="this.style.display='none'; document.getElementById('brand-monogram').style.display='flex';">
      <div class="brand-monogram" id="brand-monogram" style="display:none;">TA</div>
      <span>TIGARSEC Assess</span>
    </div>
    <button class="theme-toggle" id="theme-toggle-btn">Dark</button>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer class="app-footer" style="position:static;">
    <span>TIGARSEC Assess — internal tool, TIGARSEC Innovations</span>
  </footer>
  <script src="/static/js/theme.js"></script>
</body>
</html>
