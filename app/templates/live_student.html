<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ session.title }} - live</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon.png">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#f3f5f9; color:#1a1a1e; }
  header { background:linear-gradient(90deg,#0f2744,#1e3a5f); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header .t { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header .me { font-size:0.85rem; opacity:0.9; white-space:nowrap; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  h1 { font-size:1.3rem; margin:0 0 10px; color:#0f2744; }
  li { margin:6px 0; line-height:1.45; }
  .prompt { font-weight:600; margin-bottom:8px; line-height:1.4; }
  textarea { width:100%; min-height:90px; font-size:1.05rem; padding:10px; border:2px solid #d5d9e2; border-radius:10px; font-family:inherit;
             resize:none; overflow:hidden; }  /* grows with the answer instead of being dragged about */
  .photo-row { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:0.9rem; color:#5b5b63; }
  .photo-row label { border:2px dashed #d5d9e2; border-radius:10px; padding:8px 12px; cursor:pointer; color:#1e3a5f; font-weight:600; }
  .photo-row input { display:none; }
  .group-banner { background:#eef3fd; border:2px solid #2f6fed; border-radius:12px; padding:10px 14px; margin-bottom:14px; }
  .group-answer { margin-top:8px; font-size:0.9rem; background:#f3f5f9; border-radius:8px; padding:6px 10px; }
  .notes { color:#fff; font-size:0.8rem; text-decoration:underline; white-space:nowrap; }
  .end-notes { display:block; margin:10px auto 0; max-width:320px; text-align:center; background:#2f6fed; color:#fff; padding:12px; border-radius:10px;
               font-weight:700; text-decoration:none; }
  textarea.long { min-height:200px; }
  textarea:focus { outline:none; border-color:#2f6fed; }
  button.send { margin-top:10px; width:100%; padding:12px; font-size:1.05rem; border:none; border-radius:10px; background:#2f6fed; color:#fff; font-weight:700; }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .choices button { padding:14px 6px; border-radius:10px; border:2px solid #d5d9e2; background:#fff; font-size:0.95rem; font-weight:600; }
  .choices button.on { border-color:#2f6fed; background:#eef3fd; }
  .status { font-size:0.85rem; color:#1b8a4b; margin-top:6px; min-height:1em; }
  .status.bad { color:#a3261b; }
  .shared { margin-top:10px; padding-top:10px; border-top:1px dashed #d5d9e2; }
  .shared .a { background:#f3f5f9; border-radius:8px; padding:6px 10px; margin:4px 0; font-size:0.92rem; }
  .wait { text-align:center; color:#5b5b63; padding:30px 10px; }
  /* Stage 12 (4): personal revision after a quiz */
  .rev-btn { display:block; width:100%; margin-top:12px; padding:12px; border:none; border-radius:10px; background:#1b8a4b; color:#fff;
             font-size:1.02rem; font-weight:700; }
  .rev-choices { display:grid; gap:8px; margin-top:10px; }
  .rev-choices button { text-align:left; padding:12px; border-radius:10px; border:2px solid #d5d9e2; background:#fff; font-size:1rem; }
  .rev-choices button.right { border-color:#1b8a4b; background:#e8f6ee; font-weight:700; }
  .rev-choices button.wrong { border-color:#a3261b; background:#fdecea; }
  .rev-choices button:disabled { opacity:1; color:#1b1b1f; }
  .rev-why { margin-top:10px; padding:10px 12px; border-radius:8px; background:#f3f5f9; }
  .rev-progress { color:#5b5b63; font-size:0.85rem; margin-bottom:6px; }
  /* Stage 12 (5): reading options - each student's own choice, on their own phone */
  .aa-btn { background:rgba(255,255,255,0.18); color:#fff; border:none; border-radius:8px; padding:4px 10px; font-weight:800; font-size:0.95rem; }
  .aa-panel { position:fixed; left:0; right:0; bottom:0; background:#fff; color:#1a1a1e; border-radius:16px 16px 0 0; padding:16px 18px 22px;
              box-shadow:0 -10px 30px rgba(0,0,0,0.25); z-index:40; max-width:640px; margin:0 auto; }
  .aa-panel[hidden] { display:none; }
  .aa-panel h2 { margin:0 0 10px; font-size:1.1rem; }
  .aa-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .aa-row > span { min-width:110px; font-weight:600; }
  .aa-row button { border:2px solid #d5d9e2; background:#fff; border-radius:10px; padding:8px 12px; font-size:0.95rem; }
  .aa-row button.on { border-color:#2f6fed; background:#eef3fd; font-weight:700; }
  .aa-swatch { width:38px; height:38px; padding:0 !important; }
  .say { background:none; border:none; font-size:1.1rem; cursor:pointer; padding:0 4px; vertical-align:middle; }
  body.easy-read, body.easy-read button, body.easy-read textarea { font-family:Verdana, Tahoma, "Segoe UI", sans-serif;
             letter-spacing:0.04em; word-spacing:0.14em; }
  body.easy-read li, body.easy-read .prompt, body.easy-read p { line-height:1.75; }
  body.easy-read main { text-align:left; }
  body.tint-cream { --tint:#fbf3dc; } body.tint-yellow { --tint:#fff7b0; } body.tint-blue { --tint:#dcebfb; }
  body.tint-green { --tint:#dff3e2; } body.tint-pink { --tint:#fbe3ec; }
  body[class*="tint-"] { background:var(--tint); }
  body[class*="tint-"] .card { background:color-mix(in srgb, var(--tint) 55%, #fff); }
  body.dark { background:#101418; color:#f2f4f7; }
  body.dark .card { background:#1b2129; color:#f2f4f7; box-shadow:none; }
  body.dark h1 { color:#f2f4f7; }
  body.dark textarea, body.dark .choices button, body.dark .rev-choices button { background:#232b35; color:#f2f4f7; border-color:#3a4553; }
  body.dark .wait, body.dark .status, body.dark .rev-progress { color:#c3cad4; }
  body.dark .photo-row label { color:#9cc3ff; border-color:#4a5666; }
  body.dark .rev-choices button.right { background:#14532d; border-color:#4ade80; color:#fff; }
  body.dark .rev-choices button.wrong { background:#5b1a14; border-color:#f87171; color:#fff; }
  body.dark .rev-choices button:disabled { color:#f2f4f7; }
  body.dark .rev-why { background:#232b35; color:#f2f4f7; }
  details.version summary { font-weight:700; cursor:pointer; padding:4px 0; }
  details.version.support { border-left:4px solid #1b8a4b; }
  details.version.stretch { border-left:4px solid #2f6fed; }
  details.version .vlabel { font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; color:#5b5b63; margin-top:8px; }
  /* Stage 8: live quiz */
  .qz-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; color:#5b5b63; font-weight:600; }
  .qz-clock { background:#0f2744; color:#fff; border-radius:20px; padding:4px 12px; font-weight:800; min-width:48px; text-align:center; }
  .qz-clock.low { background:#c0392b; }
  .qz-q { font-size:1.2rem; font-weight:700; line-height:1.35; margin:6px 0 14px; color:#0f2744; }
  .qz-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qz-grid button { min-height:96px; border:none; border-radius:12px; color:#fff; font-size:1rem; font-weight:700; padding:10px;
                    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; box-shadow:0 3px 0 rgba(0,0,0,0.2); }
  .qz-grid button .shape { font-size:1.6rem; }
  .qz-grid button:disabled { opacity:0.35; }
  .qz-grid button.picked { opacity:1; outline:4px solid #0f2744; outline-offset:2px; }
  .qz-c0 { background:#e21b3c; } .qz-c1 { background:#1368ce; } .qz-c2 { background:#c98a00; } .qz-c3 { background:#26890c; }
  .qz-result { text-align:center; padding:22px 12px; border-radius:12px; color:#fff; margin-bottom:12px; }
  .qz-result.ok { background:#1b8a4b; } .qz-result.no { background:#a3261b; } .qz-result.none { background:#5b5b63; }
  .qz-result .big { font-size:1.6rem; font-weight:800; }
  .qz-result .pts { font-size:1.15rem; margin-top:4px; }
  .qz-rank { text-align:center; font-size:1.05rem; margin-top:6px; }
  .qz-board { list-style:none; padding:0; margin:0; }
  .qz-board li { display:flex; justify-content:space-between; padding:8px 10px; border-bottom:1px solid #eef0f4; }
  .qz-board li.me { background:#eef3fd; font-weight:700; border-radius:6px; }
</style>
</head>
<body>
<header><span class="t">{{ session.title }}</span>
  <span class="me">{{ name }} · <a class="notes" href="/live/{{ session.id }}/my-notes" target="_blank">My notes</a>
    <button type="button" class="aa-btn" id="aa-open" aria-label="Reading options: text size, colours, read aloud">Aa</button></span></header>
<div class="aa-panel" id="aa-panel" hidden role="dialog" aria-label="Reading options">
  <h2>Reading options <span style="font-weight:400;font-size:0.85rem;color:#5b5b63;">- only on your phone</span></h2>
  <div class="aa-row"><span>Text size</span>
    <button type="button" data-size="-1" aria-label="Smaller text">A−</button><button type="button" data-size="1" aria-label="Bigger text">A+</button></div>
  <div class="aa-row"><span>Easier reading</span><button type="button" id="aa-easy">Spaced, clear letters</button></div>
  <div class="aa-row"><span>Colour</span>
    <button type="button" class="aa-swatch" data-tint="" style="background:#f3f5f9;" aria-label="No colour"></button>
    <button type="button" class="aa-swatch" data-tint="cream" style="background:#fbf3dc;" aria-label="Cream"></button>
    <button type="button" class="aa-swatch" data-tint="yellow" style="background:#fff7b0;" aria-label="Yellow"></button>
    <button type="button" class="aa-swatch" data-tint="blue" style="background:#dcebfb;" aria-label="Blue"></button>
    <button type="button" class="aa-swatch" data-tint="green" style="background:#dff3e2;" aria-label="Green"></button>
    <button type="button" class="aa-swatch" data-tint="pink" style="background:#fbe3ec;" aria-label="Pink"></button>
    <button type="button" id="aa-dark">Dark</button></div>
  <div class="aa-row"><span>Read aloud</span><button type="button" id="aa-say">🔊 buttons on</button></div>
  <button type="button" class="send" id="aa-close">Done</button>
</div>
<main id="main"><div class="wait">Connecting…</div></main>
<script>
(function () {
  var code = {{ session.join_code|tojson }}, shownKey = null, drafts = {}, lastGroup = "null";
  var main = document.getElementById("main");
  function el(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
  function grow(t) { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 4, t.classList.contains("long") ? 200 : 90) + "px"; }
  function send(screen, key, body, status, photo) {
    var data = new FormData();
    data.append("screen", screen); data.append("question_key", key);
    Object.keys(body).forEach(function (k) { data.append(k, body[k]); });
    if (photo) data.append("photo", photo);
    status.textContent = "Sending…"; status.className = "status";
    fetch("/live/s/" + code + "/answer", {method: "POST", body: data, credentials: "same-origin"})
      .then(function (r) { return r.json(); })
      .then(function (d) { status.textContent = d.ok ? "Sent ✓ (you can change it)" : d.message; status.className = d.ok ? "status" : "status bad"; })
      .catch(function () { status.textContent = "Not sent - check your connection and try again."; status.className = "status bad"; });
  }
  // ---------------------------------------------------------------- Stage 8: live quiz
  var SHAPES = ["▲", "◆", "●", "■"], deadline = null, clockFor = null;
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function tick() {
    var c = document.getElementById("qz-clock");
    if (!c || deadline == null) return;
    var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    c.textContent = left; c.className = "qz-clock" + (left <= 5 ? " low" : "");
    if (left === 0) document.querySelectorAll(".qz-grid button").forEach(function (b) { b.disabled = true; });
  }
  setInterval(tick, 250);
  function rankLine(me) {
    if (!me) return null;
    return el("div", "You're " + ordinal(me.rank) + " of " + me.players + " with " + me.points.toLocaleString() + " points", "qz-rank");
  }
  function drawQuiz(d) {
    var s = d.screen; main.innerHTML = "";
    var card = el("div", null, "card");
    if (s.kind === "quiz_intro") {
      card.appendChild(el("h1", s.title)); (s.body || []).forEach(function (b) { card.appendChild(el("p", b)); });
      card.appendChild(el("div", "Get ready - the first question is coming…", "wait"));
      main.appendChild(card); return;
    }
    if (s.kind === "leaderboard") {
      card.appendChild(el("h1", "Final leaderboard"));
      var ol = el("ol", null, "qz-board");
      (d.top || []).forEach(function (t) {
        var li = el("li", null, d.me && d.me.rank === t.rank && d.me.points === t.points ? "me" : "");
        li.appendChild(el("span", t.rank + ". " + t.name)); li.appendChild(el("strong", t.points.toLocaleString())); ol.appendChild(li);
      });
      card.appendChild(ol);
      var r = rankLine(d.me); if (r) card.appendChild(r);
      main.appendChild(card);
      offerRevision(main);
      return;
    }
    var q = s.questions[0], mine = d.mine[q.key] || {}, answered = mine.choice != null;
    var head = el("div", null, "qz-head"); head.appendChild(el("span", s.title));
    var clock = el("span", String(q.seconds), "qz-clock"); clock.id = "qz-clock";
    if (!d.revealed) head.appendChild(clock);
    card.appendChild(head);
    if (d.revealed) {
      var right = q.answer, box;
      if (!answered) { box = el("div", null, "qz-result none"); box.appendChild(el("div", "No answer this time", "big")); }
      else if (mine.choice === right) { box = el("div", null, "qz-result ok"); box.appendChild(el("div", "Correct!", "big")); box.appendChild(el("div", "+" + (mine.points || 0) + " points", "pts")); }
      else { box = el("div", null, "qz-result no"); box.appendChild(el("div", "Not this time", "big")); }
      card.appendChild(box);
      card.appendChild(el("div", "The answer: " + SHAPES[right] + " " + q.choices[right], "prompt"));
      if (q.explanation) card.appendChild(el("p", q.explanation));
      var rl = rankLine(d.me); if (rl) card.appendChild(rl);
      main.appendChild(card); deadline = null; return;
    }
    card.appendChild(el("div", q.prompt, "qz-q"));
    var grid = el("div", null, "qz-grid"), status = el("div", "", "status");
    var timeUp = d.elapsed != null && d.elapsed >= q.seconds;
    q.choices.forEach(function (c, i) {
      var b = el("button", null, "qz-c" + i + (mine.choice === i ? " picked" : "")); b.type = "button";
      b.appendChild(el("span", SHAPES[i], "shape")); b.appendChild(el("span", c));
      b.disabled = answered || timeUp;
      b.onclick = function () {
        grid.querySelectorAll("button").forEach(function (x) { x.disabled = true; }); b.className += " picked";
        status.textContent = "Sending…"; status.className = "status";
        var data = new URLSearchParams({screen: d.current, question_key: q.key, choice: i});
        fetch("/live/s/" + code + "/answer", {method: "POST", body: data, credentials: "same-origin"})
          .then(function (r) { return r.json(); })
          .then(function (res) {
            status.textContent = res.ok ? "Locked in ✓ - watch the front for the answer" : res.message;
            status.className = res.ok ? "status" : "status bad";
          })
          .catch(function () { status.textContent = "Not sent - check your connection."; status.className = "status bad";
                               grid.querySelectorAll("button").forEach(function (x) { x.disabled = false; }); });
      };
      grid.appendChild(b);
    });
    card.appendChild(grid);
    if (answered) status.textContent = "Locked in ✓ - watch the front for the answer";
    else if (timeUp) { status.textContent = "Time's up for this question"; status.className = "status bad"; }
    card.appendChild(status);
    main.appendChild(card);
    if (d.elapsed != null) { deadline = Date.now() + (q.seconds - d.elapsed) * 1000; tick(); }
  }

  function draw(d) {
    var s = d.screen;
    if (s.kind === "quiz_question" || s.kind === "quiz_intro" || s.kind === "leaderboard") {
      var qkey = "quiz:" + d.current + ":" + d.revealed + ":" + JSON.stringify(d.mine) + ":" + JSON.stringify(d.top || null);
      if (qkey === shownKey) return;
      shownKey = qkey; drawQuiz(d); return;
    }
    var key = d.current + ":" + JSON.stringify(d.shared);
    if (key === shownKey) return;  // nothing changed - don't wipe what the student is typing
    document.querySelectorAll("textarea").forEach(function (t) { drafts[t.dataset.key] = t.value; });
    shownKey = key; main.innerHTML = "";
    if (d.group) {
      var gb = el("div", null, "group-banner");
      gb.appendChild(el("strong", "Group " + d.group.no + ": ")); gb.appendChild(document.createTextNode(d.group.members.join(", ")));
      gb.appendChild(el("div", "Work together - one answer for the group (any of you can write or change it)."));
      main.appendChild(gb);
    }
    var card = el("div", null, "card");
    var h1 = el("h1", s.title || "Look at the front"); card.appendChild(h1);
    addSay(h1, [s.title].concat(s.body || []).filter(Boolean).join(". "));
    if (s.body && s.body.length) { var ul = el("ul"); s.body.forEach(function (b) { ul.appendChild(el("li", b)); }); card.appendChild(ul); }
    main.appendChild(card);
    // Stage 10: support / stretch versions of an activity - each student opens them privately
    [["support", "Need help getting started?", "Support version"], ["stretch", "Finished? Try the challenge", "Stretch version"]].forEach(function (v) {
      var version = s[v[0]];
      if (!version) return;
      var box = el("details", null, "card version " + v[0]), sum = el("summary", v[1]);
      box.appendChild(sum); box.appendChild(el("div", v[2], "vlabel"));
      var ol = el("ol"); version.steps.forEach(function (st) { ol.appendChild(el("li", st)); }); box.appendChild(ol);
      if (version.help && version.help.length) {
        box.appendChild(el("div", "Help:", "vlabel"));
        var hl = el("ul"); version.help.forEach(function (h) { hl.appendChild(el("li", h)); }); box.appendChild(hl);
      }
      if (version.challenge) box.appendChild(el("p", "Challenge: " + version.challenge));
      main.appendChild(box);
    });
    (s.questions || []).forEach(function (q) {
      var box = el("div", null, "card"), status = el("div", "", "status"), mine = d.mine[q.key] || {};
      var promptEl = el("div", q.prompt, "prompt"); box.appendChild(promptEl); addSay(promptEl, q.prompt);
      if (q.kind === "confidence" || q.kind === "poll") {
        var row = el("div", null, "choices");
        q.choices.forEach(function (c, i) {
          var b = el("button", c); b.type = "button"; if (mine.choice === i) b.className = "on";
          b.onclick = function () { row.querySelectorAll("button").forEach(function (x) { x.className = ""; }); b.className = "on"; send(d.current, q.key, {choice: i}, status); };
          row.appendChild(b);
        });
        box.appendChild(row);
      } else {
        var t = el("textarea"); t.dataset.key = q.key; t.maxLength = 1000; if (q.long) t.className = "long";
        var groupAnswer = d.group_answers && d.group_answers[q.key];
        t.value = drafts[q.key] != null ? drafts[q.key] : (mine.text || (groupAnswer ? groupAnswer.text : "")); t.setAttribute("aria-label", q.prompt);
        t.addEventListener("input", function () { grow(t); });
        // a photo of written work or a diagram - only the lecturer sees it
        var row = el("div", null, "photo-row"), pick = el("label", mine.image ? "Change photo" : "📷 Add a photo"), file = el("input");
        file.type = "file"; file.accept = "image/*"; pick.appendChild(file); row.appendChild(pick);
        var picked = el("span", mine.image ? "Photo sent ✓ (only your lecturer sees it)" : ""); row.appendChild(picked);
        file.onchange = function () { picked.textContent = file.files.length ? file.files[0].name + " - press Send" : ""; };
        var b = el("button", "Send", "send"); b.type = "button";
        b.onclick = function () { send(d.current, q.key, {text: t.value}, status, file.files[0]); };
        box.appendChild(t); box.appendChild(row); box.appendChild(b);
        if (d.group) { var ga = el("div", "", "group-answer"); ga.id = "ga-" + q.key; box.appendChild(ga); }
        setTimeout(function () { grow(t); }, 0);
      }
      if (mine.text || mine.choice != null) { status.textContent = "Sent ✓ (you can change it)"; }
      box.appendChild(status);
      var shared = d.shared && d.shared[q.key];
      var anything = shared && (shared.counts ? shared.counts.some(function (n) { return n > 0; }) : shared.answers.length > 0);
      if (anything) {
        var sh = el("div", null, "shared"); sh.appendChild(el("strong", "The class said:"));
        if (shared.counts) shared.choices.forEach(function (c, i) { sh.appendChild(el("div", c + ": " + shared.counts[i], "a")); });
        else shared.answers.forEach(function (a) { sh.appendChild(el("div", a, "a")); });
        box.appendChild(sh);
      }
      main.appendChild(box);
    });
    if (!(s.questions || []).length && !s.support && !s.stretch) main.appendChild(el("div", "No question on this slide - listen and watch the front.", "wait"));
  }
  function showGroupAnswers(d) {
    Object.keys(d.group_answers || {}).forEach(function (k) {
      var box = document.getElementById("ga-" + k), a = d.group_answers[k];
      if (box) box.textContent = "Your group's answer so far (by " + a.by + "): " + a.text;
    });
  }
  // ---------------------------------------------------------------- Stage 12 (4): personal revision
  var practising = false;
  function offerRevision(target) {
    fetch("/live/{{ session.id }}/my-revision", {credentials: "same-origin"}).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.total) return;
      var box = el("div", null, "card");
      if (!d.questions.length) { box.appendChild(el("strong", "You got every question right - nothing to revise!")); target.appendChild(box); return; }
      box.appendChild(el("strong", "Revise what you missed"));
      box.appendChild(el("p", d.questions.length + " of " + d.total + " question" + (d.total !== 1 ? "s" : "") + " to go over - with the right answers and why."));
      var b = el("button", "Start my revision", "rev-btn"); b.type = "button";
      b.onclick = function () { practise(d.questions, 0, 0, []); };
      box.appendChild(b); target.appendChild(box);
    }).catch(function () {});
  }
  function practise(list, i, right, missed) {
    practising = true; main.innerHTML = "";
    if (i >= list.length) {
      var done = el("div", null, "card");
      done.appendChild(el("h1", right === list.length ? "All right this time!" : right + " of " + list.length + " right"));
      if (missed.length) {
        var again = el("button", "Try the " + missed.length + " I missed again", "rev-btn"); again.type = "button";
        again.onclick = function () { practise(missed, 0, 0, []); }; done.appendChild(again);
      } else { done.appendChild(el("p", "Well done - you've revised every question you missed.")); }
      var dl = el("a", "Download my notes and answers", "end-notes"); dl.href = "/live/{{ session.id }}/my-notes?download=1"; done.appendChild(dl);
      main.appendChild(done); return;
    }
    var q = list[i], card = el("div", null, "card");
    card.appendChild(el("div", "Question " + (i + 1) + " of " + list.length, "rev-progress"));
    var h = el("div", q.question, "prompt"); card.appendChild(h); addSay(h, q.question);
    if (q.picked != null && q.picked >= 0) card.appendChild(el("div", "In the quiz you picked: " + q.choices[q.picked], "rev-progress"));
    var grid = el("div", null, "rev-choices");
    q.choices.forEach(function (c, k) {
      var b = el("button", c); b.type = "button";
      b.onclick = function () {
        grid.querySelectorAll("button").forEach(function (x, n) { x.disabled = true; if (n === q.answer) x.className = "right"; });
        var ok = k === q.answer; if (!ok) b.className = "wrong";
        var why = el("div", (ok ? "Right! " : "Not quite - the answer is: " + q.choices[q.answer] + ". ") + (q.explanation || ""), "rev-why");
        card.appendChild(why);
        var next = el("button", i + 1 < list.length ? "Next question" : "See how I did", "send"); next.type = "button";
        next.onclick = function () { practise(list, i + 1, right + (ok ? 1 : 0), ok ? missed : missed.concat([q])); };
        card.appendChild(next);
      };
      grid.appendChild(b);
    });
    card.appendChild(grid); main.appendChild(card);
  }

  // ---------------------------------------------------------------- Stage 12 (5): reading options
  var prefs = {size: 0, easy: false, tint: "", dark: false, say: false};
  try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem("cc-reading") || "{}")); } catch (e) {}
  function savePrefs() { try { localStorage.setItem("cc-reading", JSON.stringify(prefs)); } catch (e) {} }
  function applyPrefs() {
    document.documentElement.style.fontSize = (100 + prefs.size * 12) + "%";
    document.body.classList.toggle("easy-read", !!prefs.easy);
    document.body.classList.toggle("dark", !!prefs.dark);
    ["cream", "yellow", "blue", "green", "pink"].forEach(function (t) { document.body.classList.toggle("tint-" + t, prefs.tint === t && !prefs.dark); });
    document.getElementById("aa-easy").className = prefs.easy ? "on" : "";
    document.getElementById("aa-dark").className = prefs.dark ? "on" : "";
    document.getElementById("aa-say").className = prefs.say ? "on" : "";
    document.querySelectorAll(".say").forEach(function (b) { b.hidden = !prefs.say; });
  }
  var canSpeak = "speechSynthesis" in window;
  if (!canSpeak) document.getElementById("aa-say").closest(".aa-row").hidden = true;
  function addSay(elem, text) {
    // a small speaker button that reads the text out (the phone's own voice - nothing is sent anywhere)
    if (!canSpeak || !text) return;
    var b = el("button", "🔊", "say"); b.type = "button"; b.setAttribute("aria-label", "Read aloud"); b.hidden = !prefs.say;
    b.onclick = function () { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 0.95; speechSynthesis.speak(u); };
    elem.appendChild(b);
  }
  document.getElementById("aa-open").onclick = function () { document.getElementById("aa-panel").hidden = false; };
  document.getElementById("aa-close").onclick = function () { document.getElementById("aa-panel").hidden = true; };
  document.querySelectorAll("[data-size]").forEach(function (b) {
    b.onclick = function () { prefs.size = Math.max(-1, Math.min(4, prefs.size + Number(b.dataset.size))); savePrefs(); applyPrefs(); };
  });
  document.querySelectorAll("[data-tint]").forEach(function (b) {
    b.onclick = function () { prefs.tint = b.dataset.tint; prefs.dark = false; savePrefs(); applyPrefs(); };
  });
  document.getElementById("aa-easy").onclick = function () { prefs.easy = !prefs.easy; savePrefs(); applyPrefs(); };
  document.getElementById("aa-dark").onclick = function () { prefs.dark = !prefs.dark; savePrefs(); applyPrefs(); };
  document.getElementById("aa-say").onclick = function () { prefs.say = !prefs.say; savePrefs(); applyPrefs(); };
  applyPrefs();

  function poll() {
    if (practising) return;  // revising after the quiz - don't redraw over it
    fetch("/live/s/" + code + "/data", {credentials: "same-origin"}).then(function (r) { return r.json(); }).then(function (d) {
      if (d.state === "removed") { window.location = "/join?code=" + encodeURIComponent(code); return; }
      if (d.state === "paused") {
        if (shownKey !== "paused") { shownKey = "paused"; main.innerHTML = "";
          main.appendChild(el("div", "Break - back soon. Keep this page open; the lesson carries on here.", "wait")); }
        return;
      }
      if (d.state !== "open") {
        main.innerHTML = ""; main.appendChild(el("div", "This lesson has finished. Thank you!", "wait"));
        var dl = el("a", "Download my notes and answers", "end-notes"); dl.href = "/live/{{ session.id }}/my-notes?download=1"; main.appendChild(dl);
        offerRevision(main);
        clearInterval(timer); return;
      }
      var groupKey = JSON.stringify(d.group || null);
      if (groupKey !== lastGroup) { lastGroup = groupKey; shownKey = null; }  // groups started/ended -> redraw
      draw(d); showGroupAnswers(d);
    }).catch(function () {});
  }
  var timer = setInterval(poll, 2000); poll();
})();
</script>
